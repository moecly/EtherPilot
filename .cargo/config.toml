# NixOS's ld.bfd rejects libglib-2.0.so's references to glibc's weakly-defined
# `free_sized@GLIBC_2.43` / `free_aligned_sized@GLIBC_2.43` even though the runtime
# libc.so.6 provides them (verified: the same link succeeds and runs with this flag).
# Allow unresolved symbols *inside linked shared libraries*; symbols in our own objects,
# including the Tauri cdylib, are still fully checked.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,--allow-shlib-undefined"]
